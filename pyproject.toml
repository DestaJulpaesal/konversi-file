[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "convertly"
version = "0.1.0"
description = "Local multi-format file conversion web app."
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.35",
    "Pillow>=10",
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "reportlab>=4",
]

[project.scripts]
exe-to-pdf-desktop = "exe_to_pdf.desktop_app:main"
exe-to-pdf-web = "exe_to_pdf.web_app:main"

[tool.setuptools.packages.find]
where = ["src"]
